[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-osint"
version = "1.5.0"
description = "SafeStack OSINT Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "dnspython==2.7.0",
  "requests==2.32.4",
  "cryptography==45.0.6"
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.9.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1"
]

[project.scripts]
ss-osint = "cli.ss_osint:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "adapters",
  "cli",
  "core_control",
  "modules"
]
