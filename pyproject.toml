[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-osint"
version = "1.5.0"
description = "SafeStack OSINT Framework"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "dnspython>=2.3.0",
  "requests>=2.31.0",
  "cryptography>=42.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0"
]

[project.scripts]
ss-osint = "cli.ss_osint:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "adapters*",
  "cli*",
  "core_control*",
  "modules*"
]
